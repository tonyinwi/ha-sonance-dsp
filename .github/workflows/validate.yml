name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch hassfest/HACS rule changes rather than finding out at release time.
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what pyproject claims to support; 3.14 is what Home Assistant
        # actually ships on. Testing only one of them leaves the other a claim
        # rather than a fact.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # pytest-homeassistant-custom-component pins the Home Assistant version
        # it was generated against, so it drags in HA itself. That is the point:
        # the suite runs against real HA internals, not a stub.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest-homeassistant-custom-component pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ -q \
            --cov=custom_components/sonance_dsp \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Gate on config flow coverage
        # The Bronze quality scale names config-flow-test-coverage specifically,
        # and unlike a global percentage this is a threshold with a meaning:
        # the flow is the first thing a user meets and its recovery paths are
        # the ones nobody exercises by hand. Everything else is reported rather
        # than gated, because a global number would only encode today's value
        # and call it a standard.
        run: |
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          for cls in root.iter("class"):
              if cls.get("filename", "").endswith("config_flow.py"):
                  rate = float(cls.get("line-rate", 0))
                  print(f"config_flow.py line coverage: {rate * 100:.1f}%")
                  if rate < 1.0:
                      missing = [
                          line.get("number")
                          for line in cls.iter("line")
                          if line.get("hits") == "0"
                      ]
                      sys.exit(
                          "config_flow.py must be 100% covered (Bronze "
                          f"config-flow-test-coverage). Uncovered lines: {missing}"
                      )
                  break
          else:
              sys.exit("config_flow.py not found in the coverage report")
          EOF

      - name: Coverage summary
        if: always()
        # Reported, not gated -- see the config-flow gate above for the one
        # threshold that carries a meaning rather than a number.
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"### Coverage: {float(root.get('line-rate', 0)) * 100:.1f}%\n")
          print("| Module | Line rate |")
          print("|---|---|")
          for cls in sorted(root.iter("class"), key=lambda c: c.get("filename")):
              name = cls.get("filename").split("/")[-1]
              print(f"| `{name}` | {float(cls.get('line-rate', 0)) * 100:.0f}% |")
          EOF
